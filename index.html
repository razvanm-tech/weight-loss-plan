<html lang="en">
<head>

<script>
  (() => {
    const saved = localStorage.getItem("wl-theme");
    const param = new URLSearchParams(window.location.search).get("scoutTheme");
    const theme = param || saved ||
      (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();

<style>
:root {

  --cp-success: #16a34a;
  --cp-danger: #dc2626;
  --cp-warning: #f59e0b;
  --cp-link: #0078d4;
  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
  --cp-overlay: rgba(255, 255, 255, 0.8);
  --cp-panel: rgba(255, 255, 255, 0.86);
  --cp-panel-strong: rgba(255, 255, 255, 0.96);
  --cp-sheen: rgba(255, 255, 255, 0.55);
  --cp-highlight: rgba(177, 31, 75, 0.12);
}
html[data-theme="dark"] {
  color-scheme: dark;
  --cp-bg: #3d3b3a;
  --cp-bg-elevated: #343231;
  --cp-surface: #292929;
  --cp-surface-soft: #2e2e2e;
  --cp-border: #474747;
  --cp-border-strong: #5f5f5f;
  --cp-text: #dedede;
  --cp-text-muted: #919191;
  --cp-text-soft: #b0b0b0;
  --cp-accent: #fd8ea1;
  --cp-accent-hover: #fb7b91;
  --cp-accent-soft: rgba(253, 142, 161, 0.14);
  --cp-accent-fg: #1a1a1a;
  --cp-success: #4ade80;
  --cp-danger: #f87171;
  --cp-warning: #fbbf24;
  --cp-link: #4da6ff;
  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
  --cp-overlay: rgba(41, 41, 41, 0.88);
  --cp-panel: rgba(41, 41, 41, 0.72);
  --cp-panel-strong: rgba(41, 41, 41, 0.96);

}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--cp-bg); color: var(--cp-text);
  font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 15px; line-height: 1.45;
}
header {
  position: sticky; top: 0; z-index: 10; background: var(--cp-panel-strong);
  border-bottom: 1px solid var(--cp-border); backdrop-filter: blur(6px);
}
.bar { max-width: 960px; margin: 0 auto; padding: 12px 16px 0; display: flex; align-items: center; gap: 10px; }
.bar h1 { font-size: 18px; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar h1 span { color: var(--cp-accent); }
.who { display: flex; border: 1px solid var(--cp-border-strong); border-radius: 0.625rem; overflow: hidden; }
.who button { border: none; background: var(--cp-surface); color: var(--cp-text); font: inherit; font-weight: 600; padding: 5px 12px; cursor: pointer; }
.who button.active { background: var(--cp-accent); color: var(--cp-accent-fg); }
nav { max-width: 960px; margin: 0 auto; display: flex; gap: 4px; padding: 8px 12px 0; overflow-x: auto; scrollbar-width: none; }
nav::-webkit-scrollbar { display: none; }
nav button {
  border: none; background: none; color: var(--cp-text-muted); font: inherit; font-weight: 600;
  padding: 8px 14px; border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap;
}
@media (max-width: 480px) { nav button { padding: 8px 10px; } .bar h1 { font-size: 16px; } }
nav button.active { color: var(--cp-accent); border-bottom-color: var(--cp-accent); }
main { max-width: 960px; margin: 0 auto; padding: 16px; }
.card {
  background: var(--cp-surface); border: 1px solid var(--cp-border); border-radius: 16px;
  box-shadow: 0 0 2px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.14);
  padding: 16px; margin-bottom: 16px;
}
.card h2 { font-size: 17px; margin: 0 0 10px; }
.card h3 { font-size: 15px; margin: 14px 0 6px; }
.muted { color: var(--cp-text-muted); }
.small { font-size: 13px; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.pill {
  border: 1px solid var(--cp-border); background: var(--cp-surface); color: var(--cp-text);
  border-radius: 0.625rem; padding: 6px 12px; font: inherit; cursor: pointer;
}
.pill.active { background: var(--cp-accent); color: var(--cp-accent-fg); border-color: var(--cp-accent); }
.pill.today:not(.active) { border-color: var(--cp-accent); color: var(--cp-accent); }
.btn {
  border: 1px solid var(--cp-border-strong); background: var(--cp-surface); color: var(--cp-text);
  border-radius: 0.625rem; padding: 6px 12px; font: inherit; cursor: pointer;
}
.btn:hover { border-color: var(--cp-accent); }
.btn.primary { background: var(--cp-accent); color: var(--cp-accent-fg); border-color: var(--cp-accent); }
.btn.primary:hover { background: var(--cp-accent-hover); }
.btn.icon { padding: 4px 8px; }
.btn.danger:hover { border-color: var(--cp-danger); color: var(--cp-danger); }
.tag {
  display: inline-block; background: var(--cp-accent-soft); color: var(--cp-accent);
  border-radius: 0.625rem; padding: 2px 8px; font-size: 12px; font-weight: 600;
}
.note-box { background: var(--cp-accent-soft); border-left: 3px solid var(--cp-accent); border-radius: 0.625rem; padding: 10px 12px; font-size: 13px; margin-bottom: 16px; }
.meal { display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid var(--cp-border); align-items: flex-start; }
.meal:first-of-type { border-top: none; }
.meal .time { width: 52px; flex-shrink: 0; font-weight: 700; color: var(--cp-accent); }
.meal .body { flex: 1; }
.meal .name { font-weight: 600; }
.macros { display: flex; gap: 10px; font-size: 12px; color: var(--cp-text-muted); margin-top: 3px; flex-wrap: wrap; }
.macros b { color: var(--cp-text); }
.meal.done .body { opacity: 0.5; text-decoration: line-through; }
input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--cp-accent); cursor: pointer; flex-shrink: 0; margin-top: 2px; }
.totals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
.stat { background: var(--cp-surface-soft); border-radius: 0.625rem; padding: 8px; text-align: center; }
.stat .v { font-size: 18px; font-weight: 700; }
.stat .l { font-size: 12px; color: var(--cp-text-muted); }
.progress { height: 6px; background: var(--cp-surface-soft); border-radius: 3px; overflow: hidden; margin-top: 8px; }
.progress div { height: 100%; background: var(--cp-accent); transition: width .2s; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; background: var(--cp-surface-soft); color: var(--cp-text-muted); font-weight: 600; font-size: 13px; }
th, td { padding: 7px 8px; border-bottom: 1px solid var(--cp-border); vertical-align: top; }
td.num, th.num { text-align: center; white-space: nowrap; }
tr.dayrow td { background: var(--cp-accent-soft); color: var(--cp-accent); font-weight: 700; }
tr.total td { font-weight: 700; }
.tablewrap { overflow-x: auto; }
ul { margin: 6px 0; padding-left: 20px; }
li { margin: 3px 0; }
.ex { display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid var(--cp-border); align-items: flex-start; }
.ex:first-of-type { border-top: none; }
.ex .body { flex: 1; }
.ex.done .body { opacity: 0.5; text-decoration: line-through; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.week div { background: var(--cp-surface-soft); border-radius: 0.625rem; padding: 8px; font-size: 13px; }
.week div b { display: block; color: var(--cp-accent); }
@media (max-width: 640px) { .week { grid-template-columns: repeat(2, 1fr); } .totals { grid-template-columns: repeat(2, 1fr); } }
.shop-toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
.shop-cat { margin-top: 14px; font-weight: 700; color: var(--cp-accent); font-size: 13px; text-transform: uppercase; letter-spacing: .04em; }
.shop-item { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--cp-border); }
.shop-item .body { flex: 1; min-width: 0; }
.shop-item .qty { color: var(--cp-text-muted); font-size: 13px; }
.shop-item .note { color: var(--cp-text-soft); font-size: 12px; }

  border-radius: 6px; background: var(--cp-bg-elevated); color: var(--cp-text); margin: 2px 0;

.addform { display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 8px; }
.addform input, .addform select {
  font: inherit; padding: 6px 8px; border: 1px solid var(--cp-border-strong); border-radius: 0.625rem;

@media (max-width: 640px) { .addform { grid-template-columns: 1fr 1fr; } }
.toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--cp-text);
  color: var(--cp-bg); padding: 8px 16px; border-radius: 0.625rem; opacity: 0; transition: opacity .2s; pointer-events: none;
}
.toast.show { opacity: 1; }
.hidden { display: none !important; }
</style>
</head>

/* ===================== HELPERS ===================== */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, ch => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[ch]));
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } };
const save = (k, v) => localStorage.setItem(k, JSON.stringify(v));
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 1600); }
const todayKey = () => DAYS[(new Date().getDay() + 6) % 7];
function dateForDay(day) {
  const now = new Date(); const offset = DAYS.indexOf(day) - (now.getDay() + 6) % 7;
  const d = new Date(now.getFullYear(), now.getMonth(), now.getDate() + offset);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
const sum = (meals, key) => meals.reduce((a, m) => a + (m[key] || 0), 0);

let who = localStorage.getItem("wl-who") || "razvan";
const P = () => PROFILES[who];

/* ===================== TABS / PROFILE ===================== */
function showTab(name) {
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === name));
  document.querySelectorAll("main > section").forEach(s => s.classList.toggle("hidden", s.id !== "tab-" + name));
  localStorage.setItem("wl-tab", name);
}
function setWho(w) {
  who = w; localStorage.setItem("wl-who", w);
  document.querySelectorAll("#who button").forEach(b => b.classList.toggle("active", b.dataset.who === w));
  $("#title").innerHTML = `${P().name} ${P().goal}`;
  document.title = `${P().name} – plan`;
  renderToday(); renderMeals(); renderTraining();
}
$("#tabs").addEventListener("click", e => { if (e.target.dataset.tab) showTab(e.target.dataset.tab); });
$("#who").addEventListener("click", e => { if (e.target.dataset.who) setWho(e.target.dataset.who); });
$("#themeBtn").addEventListener("click", () => {
  const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next); localStorage.setItem("wl-theme", next);
});

/* ===================== TODAY ===================== */
let selDay = todayKey();
const doneKey = () => `wl-done-${who}-${dateForDay(selDay)}`;
function exerciseList(planKey, doneMap) {
  const p = P().sessions[planKey];
  return `<h3>${esc(p.name)}</h3>` + p.ex.map((e, i) => {
    const id = `x${planKey}-${i}`;
    return `<label class="ex ${doneMap[id] ? "done" : ""}"><input type="checkbox" data-done="${id}" ${doneMap[id] ? "checked" : ""}>
      <div class="body"><div><b>${esc(e[0])}</b> · ${esc(e[1])}</div>${e[2] ? `<div class="small muted">${esc(e[2])}</div>` : ""}</div></label>`;
  }).join("");
}
function renderToday() {
  const done = load(doneKey(), {});
  const m = P().menu[selDay], tr = P().trainingByDay[selDay];
  const tracked = m.meals.map((x, i) => ({ x, i })).filter(o => !o.x.train);
  const eaten = tracked.filter(o => done["m" + o.i]);
  const pct = tracked.length ? Math.round(eaten.length / tracked.length * 100) : 0;

  const pills = DAYS.map(d => `<button class="pill ${d === selDay ? "active" : ""} ${d === todayKey() ? "today" : ""}" data-day="${d}">${DAY_NAMES[d].slice(0,3)}</button>`).join("");
  const meals = m.meals.map((x, i) => {
    const id = "m" + i;
    if (x.train) return `<div class="meal"><span style="width:20px"></span><div class="time">${esc(x.t)}</div><div class="body"><span class="tag">🏃 ${esc(x.n)}</span></div></div>`;
    return `<label class="meal ${done[id] ? "done" : ""}"><input type="checkbox" data-done="${id}" ${done[id] ? "checked" : ""}>
      <div class="time">${esc(x.t)}</div>
      <div class="body"><div class="name">${esc(x.n)}</div><div class="small">${esc(x.d)}</div>
      ${x.k ? `<div class="macros"><span><b>${x.k}</b> kcal</span><span>P <b>${x.p}</b> g</span><span>C <b>${x.c}</b> g</span><span>F <b>${x.f}</b> g</span></div>` : ""}</div></label>`;
  }).join("");
  const stats = m.weekend ? `<p class="small muted">Weekend: follow the portion guide (Meal plan tab).</p>` : `
    <div class="totals">
      <div class="stat"><div class="v">${sum(m.meals,"k").toLocaleString()}</div><div class="l">kcal</div></div>
      <div class="stat"><div class="v">${sum(m.meals,"p")} g</div><div class="l">protein</div></div>
      <div class="stat"><div class="v">${sum(m.meals,"c")} g</div><div class="l">carbs</div></div>
      <div class="stat"><div class="v">${sum(m.meals,"f")} g</div><div class="l">fat</div></div>
    </div>`;
  const progress = `<div class="progress"><div style="width:${pct}%"></div></div>
    <div class="small muted" style="margin-top:4px">${eaten.length} of ${tracked.length} done</div>`;

  $("#tab-today").innerHTML = `
    <div class="pills">${pills}</div>
    <div class="card">
      <h2>🍽️ ${DAY_NAMES[selDay]} <span class="tag">${esc(m.tag)}</span></h2>
      ${meals}${stats}${progress}
    </div>
    <div class="card">
      <h2>🏋️ ${esc(tr.title)}</h2>
      <p class="small muted">${esc(tr.sub)}</p>
      ${tr.plan ? exerciseList(tr.plan, done) : ""}
    </div>
    <div class="card small">${P().dailyRules}</div>`;
}
$("#tab-today").addEventListener("click", e => {

});
$("#tab-today").addEventListener("change", e => {
  const id = e.target.dataset.done; if (!id) return;
  const done = load(doneKey(), {});
  if (e.target.checked) done[id] = true; else delete done[id];
  save(doneKey(), done); renderToday();
});

function renderMeals() {
  const prof = P();
  const rows = DAYS.filter(d => !prof.menu[d].weekend).map(d => {
    const m = prof.menu[d];
    const body = m.meals.filter(x => !x.train && x.k).map(x => `<tr><td>${esc(x.t)}</td><td><b>${esc(x.n)}</b> – ${esc(x.d)}</td><td class="num">${x.k}</td><td class="num">${x.p}</td><td class="num">${x.c}</td><td class="num">${x.f}</td></tr>`).join("");
    return `<tr class="dayrow"><td colspan="6">${DAY_NAMES[d]} – ${esc(m.tag)}</td></tr>${body}
      <tr class="total"><td></td><td>Day total</td><td class="num">~${sum(m.meals,"k").toLocaleString()}</td><td class="num">${sum(m.meals,"p")}</td><td class="num">${sum(m.meals,"c")}</td><td class="num">${sum(m.meals,"f")}</td></tr>`;
  }).join("");
  const menu = `<div class="card"><h2>Weekly menu – Monday to Friday</h2>
    <p class="small muted">Meat/fish raw weight; rice, bulgur, potatoes cooked weight. P/C/F in grams, ±10–15% by brand.</p>

  $("#tab-meals").innerHTML = prof.mealPlanHtml.replace("%MENU%", menu);
}

/* ===================== TRAINING ===================== */
function renderTraining() {
  const prof = P();
  const week = DAYS.map(d => `<div><b>${DAY_NAMES[d].slice(0,3)}</b>${esc(prof.trainingByDay[d].title)}</div>`).join("");
  const sessions = Object.values(prof.sessions).map(s => `<div class="card"><h2>${esc(s.name)}</h2><div class="tablewrap"><table>
      <tr><th>What</th><th>How much</th><th>Progression / note</th></tr>
      ${s.ex.map(e => `<tr><td>${esc(e[0])}</td><td>${esc(e[1])}</td><td>${esc(e[2])}</td></tr>`).join("")}</table></div></div>`).join("");
  $("#tab-training").innerHTML = `<div class="card"><h2>Weekly schedule</h2><div class="week">${week}</div></div>` +
    prof.trainingHtml.replace("%SESSIONS%", sessions);
}

/* ===================== SHOPPING (shared) ===================== */
const SHOP_KEY = "wl-shopping-family-v1";
const defaultShop = () => DEFAULT_SHOPPING.map((r, i) => ({ id: "d" + i, cat: r[0], name: r[1], qty: r[2], note: r[3], checked: false }));
let shop = load(SHOP_KEY, null) || defaultShop();
let hideChecked = load("wl-hide-checked", false);
let editing = null;
const saveShop = () => save(SHOP_KEY, shop);

function renderShopping() {
  const left = shop.filter(i => !i.checked).length;
  const cats = [...new Set([...CATEGORIES, ...shop.map(i => i.cat)])];
  const list = cats.map(cat => {
    const items = shop.filter(i => i.cat === cat && !(hideChecked && i.checked));
    if (!items.length) return "";
    return `<div class="shop-cat">${esc(cat)}</div>` + items.map(i => editing === i.id ? `
      <div class="shop-item" data-id="${esc(i.id)}">
        <div class="body">
          <input type="text" data-f="name" value="${esc(i.name)}" placeholder="Item">
          <input type="text" data-f="qty" value="${esc(i.qty)}" placeholder="Amount">
          <input type="text" data-f="note" value="${esc(i.note)}" placeholder="Note">
        </div>
        <button class="btn icon primary" data-act="saveedit">Save</button>
      </div>` : `
      <div class="shop-item ${i.checked ? "checked" : ""}" data-id="${esc(i.id)}">
        <input type="checkbox" data-act="toggle" ${i.checked ? "checked" : ""}>
        <div class="body"><div>${esc(i.name)} ${i.qty ? `<span class="qty">· ${esc(i.qty)}</span>` : ""}</div>${i.note ? `<div class="note">${esc(i.note)}</div>` : ""}</div>
        <button class="btn icon" data-act="edit" title="Edit">✏️</button>
        <button class="btn icon danger" data-act="del" title="Delete">🗑️</button>
      </div>`).join("");
  }).join("");

  $("#tab-shopping").innerHTML = `
    <div class="card">
      <h2>🛒 Family shopping list <span class="tag">${left} left</span></h2>
      <p class="small muted">Shared list for Razvan (R) + Paula (P), Monday–Friday portions. Add your child's food and weekend meals. Changes are saved on this device.</p>
      <div class="shop-toolbar">
        <button class="btn primary" data-act="newweek">New week (untick all)</button>
        <button class="btn" data-act="hide">${hideChecked ? "Show" : "Hide"} ticked</button>
        <button class="btn" data-act="copy">Copy list</button>
        <button class="btn danger" data-act="reset">Reset to default</button>
      </div>
      <div class="addform">
        <input id="newName" placeholder="Add item…">
        <input id="newQty" placeholder="Amount">
        <select id="newCat">${CATEGORIES.map(c => `<option>${esc(c)}</option>`).join("")}</select>
        <button class="btn primary" data-act="add">Add</button>
      </div>
      ${list || `<p class="muted">Everything is ticked 🎉</p>`}
    </div>`;
}
$("#tab-shopping").addEventListener("click", e => {
  const act = e.target.dataset.act; if (!act) return;
  const row = e.target.closest(".shop-item"); const item = row && shop.find(i => i.id === row.dataset.id);
  if (act === "toggle") { item.checked = e.target.checked; }
  else if (act === "del") { if (!confirm(`Delete "${item.name}"?`)) return; shop = shop.filter(i => i !== item); }
  else if (act === "edit") { editing = item.id; }
  else if (act === "saveedit") {
    row.querySelectorAll("input[data-f]").forEach(inp => item[inp.dataset.f] = inp.value.trim());
    editing = null;
  }
  else if (act === "add") {
    const name = $("#newName").value.trim(); if (!name) { $("#newName").focus(); return; }
    shop.push({ id: "u" + Date.now(), cat: $("#newCat").value, name, qty: $("#newQty").value.trim(), note: "", checked: false });
    toast("Added " + name);
  }
  else if (act === "newweek") { shop.forEach(i => i.checked = false); toast("Ready for a new week"); }
  else if (act === "hide") { hideChecked = !hideChecked; save("wl-hide-checked", hideChecked); }
  else if (act === "reset") { if (!confirm("Reset the list to the default plan? Your edits will be lost.")) return; shop = defaultShop(); }
  else if (act === "copy") {
    const text = shop.filter(i => !i.checked).map(i => `☐ ${i.name}${i.qty ? " – " + i.qty : ""}`).join("\n");
    navigator.clipboard.writeText(text).then(() => toast("Copied to clipboard"), () => toast("Copy failed"));
    return;
  }
  saveShop(); renderShopping();
});
$("#tab-shopping").addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.target.id === "newName" || e.target.id === "newQty")) $("[data-act=add]").click();
});

/* ===================== INIT ===================== */
renderShopping();
setWho(PROFILES[who] ? who : "razvan");
showTab(localStorage.getItem("wl-tab") || "today");
</script>
